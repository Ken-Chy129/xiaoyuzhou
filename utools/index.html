<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>小宇宙待办</title>
<style>
  :root {
    --bg: #fbfaf7; --surface: #ffffff; --ink: #1d1c19; --ink2: #57544d; --ink3: #9a958b;
    --line: #ebe7df; --line2: #f3f1ec; --accent: #2f6fb3; --accentSoft: #e6eff9;
    --late: #c0532f; --star: #d38a2e; --sel: #f1efe9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --surface: #1e1f22; --ink: #ecebe6; --ink2: #b6b3aa; --ink3: #7c7a74;
      --line: #2c2d30; --line2: #232427; --accent: #8cbcf0; --accentSoft: #22303f;
      --late: #ec8a66; --star: #f0b35a; --sel: #26272b;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased; user-select: none; overflow: hidden;
  }
  #app { height: 100%; display: flex; flex-direction: column; }
  .scroll { flex: 1; overflow-y: auto; padding: 6px 10px 10px; }
  .scroll::-webkit-scrollbar { width: 6px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

  .head { display: flex; align-items: baseline; gap: 10px; padding: 12px 16px 4px; }
  .head h1 { font-size: 17px; margin: 0; font-weight: 650; }
  .head span { color: var(--ink3); font-size: 12px; }
  .head .sp { flex: 1; }
  .head a { color: var(--ink3); font-size: 12px; text-decoration: none; cursor: pointer; }
  .head a:hover { color: var(--accent); }

  .sec { display: flex; align-items: center; gap: 6px; margin: 12px 8px 4px; font-size: 12px; font-weight: 600; color: var(--ink3); }
  .sec b { font-weight: 500; font-size: 11px; padding: 0 6px; border-radius: 99px; background: var(--line2); color: var(--ink2); line-height: 17px; }
  .sec.late { color: var(--late); }
  .sec.toggle { cursor: pointer; }
  .sec .chev { transition: transform .15s; display: inline-block; }
  .sec.closed .chev { transform: rotate(-90deg); }

  .row {
    display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 10px; cursor: default;
    transition: background .12s;
  }
  .row.sel { background: var(--sel); }
  .check {
    flex: none; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--ink3); background: none; padding: 0;
    display: grid; place-items: center; color: var(--surface); font-size: 11px; cursor: pointer; transition: all .15s;
  }
  .check:hover { border-color: var(--accent); }
  .check.late { border-color: var(--late); }
  .row.done .check { background: var(--accent); border-color: var(--accent); }
  .body { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; }
  .body { cursor: text; }
  .row:hover .text { text-decoration: underline dotted var(--line); text-underline-offset: 3px; }
  .row.done:hover .text { text-decoration: line-through; }

  .mask {
    position: fixed; inset: 0; background: rgba(20, 20, 18, .28); display: flex; align-items: flex-start; justify-content: center;
    padding-top: 36px; animation: fade .14s ease-out; z-index: 10;
  }
  .sheet {
    width: min(460px, 92%); background: var(--surface); border-radius: 16px; padding: 14px 16px 12px;
    box-shadow: 0 18px 50px -12px rgba(0,0,0,.35), 0 0 0 1px var(--line); animation: pop .18s cubic-bezier(.2,.9,.3,1.1);
    user-select: text;
  }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.98); } }
  .ed-head { display: flex; align-items: center; margin-bottom: 10px; }
  .ed-head b { font-size: 14px; font-weight: 650; }
  .sp { flex: 1; }
  .x { border: 0; background: none; color: var(--ink3); cursor: pointer; font-size: 13px; padding: 2px 4px; border-radius: 6px; }
  .x:hover { background: var(--line2); color: var(--ink); }
  .ed-text {
    width: 100%; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    font: inherit; font-size: 15px; padding: 0 12px; outline: none; margin-bottom: 8px;
  }
  .ed-text:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accentSoft); }
  .ed-row { display: flex; align-items: center; gap: 12px; padding: 6px 0; transition: opacity .15s; }
  .ed-row.off { opacity: .4; }
  .ed-row label { flex: none; width: 30px; font-size: 12px; color: var(--ink3); }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pill, .ed-in {
    height: 28px; padding: 0 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink2);
    font: inherit; font-size: 12.5px; cursor: pointer; transition: all .12s; outline: none;
  }
  .ed-in { padding: 0 8px; color-scheme: light dark; }
  .pill:hover:not(:disabled), .ed-in:hover:not(:disabled) { border-color: var(--ink3); }
  .pill.on, .ed-in.on { background: var(--accentSoft); border-color: transparent; color: var(--accent); font-weight: 600; }
  .pill:disabled, .ed-in:disabled { cursor: default; }
  .ed-foot { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line2); }
  .ed-foot .hint { font-size: 11.5px; color: var(--ink3); }
  .ed-foot kbd { font: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-right: 3px; }
  .btn { height: 30px; padding: 0 14px; border-radius: 9px; border: 0; font: inherit; font-size: 13px; cursor: pointer; transition: all .12s; }
  .btn.primary { background: var(--accent); color: var(--surface); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.primary:disabled { opacity: .6; }
  .btn.danger { background: none; color: var(--late); padding: 0 6px; }
  .btn.danger:hover { background: var(--line2); }
  .text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.done .text { color: var(--ink3); text-decoration: line-through; }
  .meta { flex: none; font-size: 12px; color: var(--ink3); font-variant-numeric: tabular-nums; }
  .meta.late { color: var(--late); }
  .star { flex: none; border: 0; background: none; color: var(--ink3); cursor: pointer; font-size: 14px; padding: 0 2px; opacity: 0; transition: opacity .12s; }
  .row:hover .star, .row.sel .star, .star.on { opacity: 1; }
  .star.on { color: var(--star); }
  .del { flex: none; border: 0; background: none; color: var(--ink3); cursor: pointer; font-size: 13px; opacity: 0; padding: 0 2px; }
  .row:hover .del, .row.sel .del { opacity: .8; }
  .del:hover { color: var(--late); }

  .add {
    display: flex; align-items: center; gap: 10px; margin: 6px 0 2px; padding: 10px 12px; border-radius: 12px;
    background: var(--accentSoft); color: var(--accent);
  }
  .add .k { flex: none; font-size: 11px; border: 1px solid currentColor; border-radius: 5px; padding: 0 5px; opacity: .8; }
  .add .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
  .add small { color: var(--ink3); flex: none; }
  .add.busy .k { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  .empty { text-align: center; color: var(--ink3); padding: 46px 0 20px; }
  .empty .big { font-size: 30px; margin-bottom: 8px; }

  .foot {
    flex: none; display: flex; gap: 14px; padding: 7px 16px; border-top: 1px solid var(--line); color: var(--ink3); font-size: 11.5px;
    background: var(--bg);
  }
  .foot kbd { font: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-right: 3px; background: var(--surface); }

  .toast {
    position: fixed; left: 50%; bottom: 44px; transform: translate(-50%, 8px); opacity: 0; pointer-events: none;
    background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 13px; display: flex; gap: 12px; align-items: center;
    transition: all .18s; box-shadow: 0 8px 24px -8px rgba(0,0,0,.35); max-width: 92%;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button { border: 0; background: none; color: var(--accentSoft); font: inherit; cursor: pointer; padding: 0; text-decoration: underline; }

  .pair { margin: auto; width: 300px; text-align: center; padding-bottom: 20px; }
  .pair h2 { font-size: 18px; margin: 14px 0 6px; }
  .pair p { color: var(--ink2); font-size: 13px; margin: 0 0 18px; line-height: 1.7; }
  .pair code { background: var(--line2); padding: 1px 6px; border-radius: 5px; font-size: 12px; }
  .pair input {
    width: 100%; height: 44px; text-align: center; font-size: 22px; letter-spacing: 8px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); outline: none; font-variant-numeric: tabular-nums;
  }
  .pair input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accentSoft); }
  .pair .err { color: var(--late); font-size: 12px; min-height: 18px; margin-top: 8px; }
  .pair img { width: 56px; height: 56px; border-radius: 14px; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
